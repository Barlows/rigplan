# nginx site for the electrical load schedule workbench.
#
# Two things here are load-bearing and both were got wrong in different projects.
#
# 1. THE HTML MUST NOT BE CACHED. Every script tag in index.html carries a
#    ?v= cache-buster that tools/bump.py rewrites on every change. That scheme
#    works by getting the browser to ask for a NEW URL when the code changes.
#    If nginx serves a cached index.html, the browser keeps being handed the OLD
#    ?v= and quietly keeps running the OLD code — while every deploy appears to
#    succeed. This is the single most common way an auto-update becomes a no-op
#    without anyone noticing, so index.html is sent no-store.
#
# 2. THE JS AND CSS CAN BE CACHED FOREVER. That is the other half of the scheme
#    and it is why the ?v= exists: the filenames never change, so a content-
#    addressed query is the only thing that makes a new build a new URL.
#
# Copy to /etc/nginx/sites-available/elschedule, symlink into sites-enabled,
# and `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # If you put this behind a hostname and want HTTPS, add a listen 443 block
    # and a redirect. Do NOT put a certificate on this blindly — see deploy/README.md.

    root /var/www/electrical-load-schedule/current;
    index index.html;

    # Long-lived caching only for the versioned assets. Everything else is
    # revalidated, so a change is visible on the next load either way.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # The document set — the transformer specification belongs with the app.
    location /docs/ {
        autoindex off;
        try_files $uri $uri/ =404;
    }

    # Dev artefacts. The test pages are of no use to a browser opening the app,
    # and tools/ holds the import scripts. Neither needs to be reachable, and
    # neither should be: tools/ is where an exported project file lands, and
    # .gitignore keeps those out of the checkout — but relying on that alone is
    # the wrong kind of protection.
    location /test/ { deny all; return 404; }
    location /tools/ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }

    # No server-side data exists, so nothing here should ever be logged with a
    # body or a query string worth having. There is no API; this is a file server.
    access_log /var/log/nginx/elschedule.access.log;
    error_log  /var/log/nginx/elschedule.error.log warn;

    # Modest hardening. The app runs entirely in the browser, so most of this
    # costs nothing and buys nothing either — it is here so that adding
    # something later does not start from an open door.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript text/html application/json image/svg+xml;
    gzip_min_length 1024;
}